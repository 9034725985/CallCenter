name: Dotnet Client Tests

on:
  [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClientTests
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: pwd
      run: pwd
    - name: clean
      run: dotnet clean
    - name: build
      run: dotnet build
    - name: Test
      run: dotnet test --verbosity normal